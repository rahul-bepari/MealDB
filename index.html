<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MealDB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="bg-dark text-white py-4 mb-4 shadow-sm">
        <div class="container text-center">
            <h1 class="mb-1">The MealDB </h1>
            <p class="mb-0 text-white-50">Search thousands of meals from around the world</p>
        </div>
    </header>

    <main class="container flex-grow-1">

        <!-- Search Bar -->
        <div class="row justify-content-center mb-4">
            <div class="col-md-8">
                <div class="input-group input-group-lg shadow-sm">
                    <input id="searchTerm" type="text" class="form-control" placeholder="Enter meal or food name (e.g. chicken, pasta, cake)">
                    <button class="btn btn-danger" onclick="connect()">Search</button>
                </div>
            </div>
        </div>
    </main>








    <footer class="bg-dark text-white text-center py-3 mt-5">
        <div class="container">
            <p class="mb-0">&copy; 2026 Meal DB Explorer
            </p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
